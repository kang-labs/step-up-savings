# 버전 태그(v1.2.3)를 올리면 PC exe 와 안드로이드 apk 를 만들어 GitHub Releases 에 올린다.
# 태그는 package.json 의 version 과 같아야 한다 (예: version 1.2.3 → 태그 v1.2.3).
name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    check:
        name: 버전·타입·테스트 확인
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - name: 태그와 package.json 버전 비교
              run: |
                  version=$(jq -r .version package.json)
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전 $version 이 다릅니다."
                      exit 1
                  fi
            - run: npm ci
            - run: npx tsc -b
            - run: npm test

    windows:
        name: PC exe
        needs: check
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build -- --publish never
            # GitHub 은 첨부 파일 이름의 한글을 지우므로 영문 이름으로 바꾼다.
            - name: 영문 파일 이름으로 복사
              shell: bash
              run: |
                  mkdir out
                  cp release/*.exe "out/step-up-savings-$GITHUB_REF_NAME-windows.exe"
            - uses: actions/upload-artifact@v7
              with:
                  name: windows
                  path: out/*
                  if-no-files-found: error

    android:
        name: 안드로이드 apk
        needs: check
        runs-on: ubuntu-latest
        env:
            KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21
            - run: npm ci
            # 업로드 키가 Secrets 에 있으면 서명된 apk, 없으면 테스트용(debug) apk.
            - name: 업로드 키 준비
              if: env.KEYSTORE_BASE64 != ''
              env:
                  STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
                  {
                      echo "storeFile=$RUNNER_TEMP/upload.jks"
                      echo "storePassword=$STORE_PASSWORD"
                      echo "keyAlias=$KEY_ALIAS"
                      echo "keyPassword=$KEY_PASSWORD"
                  } > android/keystore.properties
            - name: 서명된 apk 만들기
              if: env.KEYSTORE_BASE64 != ''
              run: |
                  npm run android:release
                  mkdir out
                  cp release/*.apk "out/step-up-savings-$GITHUB_REF_NAME.apk"
            - name: 테스트용 apk 만들기
              if: env.KEYSTORE_BASE64 == ''
              run: |
                  npm run android:apk
                  mkdir out
                  cp release/*.apk "out/step-up-savings-$GITHUB_REF_NAME-test.apk"
            - uses: actions/upload-artifact@v7
              with:
                  name: android
                  path: out/*
                  if-no-files-found: error

    release:
        name: Releases 에 올리기
        needs: [windows, android]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: out
                  merge-multiple: true
            - name: 릴리스 만들기
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cat > notes.md <<'EOF'
                  ## 내려받기

                  - **PC(Windows)**: `…-windows.exe` 를 내려받아 더블클릭 (설치 없음). "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**.
                  - **안드로이드**: `….apk` 를 휴대폰에서 내려받아 열고 "출처를 알 수 없는 앱 설치"를 허용.
                    `…-test.apk` 는 테스트용이라 이전 버전 위에 덮어 설치되지 않을 수 있습니다.
                  EOF
                  gh release create "$GITHUB_REF_NAME" out/* \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "증액저축 계산기 $GITHUB_REF_NAME" \
                      --notes-file notes.md \
                      --generate-notes
