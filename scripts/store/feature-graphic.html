<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>증액저축 계산기 Play 대표 이미지</title>
        <link rel="stylesheet" href="../../node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
        <style>
            /* Play 대표 이미지 1024×500 — scripts/store-assets.cjs 가 이 파일을 그대로 찍는다 */
            html,
            body {
                margin: 0;
                width: 1024px;
                height: 500px;
                overflow: hidden;
            }

            body {
                box-sizing: border-box;
                display: flex;
                align-items: center;
                gap: 60px;
                padding: 0 92px;
                background: radial-gradient(circle at 85% 15%, #fdf9f1 0%, #f6f2ea 45%, #ebe3d5 100%);
                color: #1c2420;
                font-family: 'Pretendard Variable', Pretendard, sans-serif;
            }

            img {
                flex: none;
                width: 228px;
                height: 228px;
                border-radius: 52px;
                box-shadow: 0 24px 56px rgb(17 85 58 / 0.35);
            }

            h1 {
                margin: 0;
                font-size: 64px;
                font-weight: 800;
                letter-spacing: -0.03em;
                color: #135c3f;
            }

            p {
                margin: 20px 0 0;
                font-size: 30px;
                font-weight: 600;
                line-height: 1.45;
                color: #57625c;
            }
        </style>
    </head>
    <body>
        <img src="../../src/assets/logo.svg" alt="" />
        <div>
            <h1>증액저축 계산기</h1>
            <p>목표까지 매달 얼마씩,<br />해마다 얼마나 늘려 갈지</p>
        </div>
    </body>
</html>
